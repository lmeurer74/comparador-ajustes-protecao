<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Comparador de Ajustes</title>
    <!-- Carrega o CSS do stlite -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.31.1/build/stlite.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Carrega o JS do stlite (que roda o Pyodide por trás) -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.31.1/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          // Bibliotecas que estão no seu requirements.txt
          requirements: ["streamlit", "openpyxl", "pandas"],
          // Arquivo principal que o Streamlit vai rodar
          entrypoint: "app.py",
          // Mapeamento dos arquivos usando URLs diretas do seu repositório no GitHub (branch v2-modular)
          files: {
            "app.py": { 
              url: "https://raw.githubusercontent.com/lmeurer74/comparador-ajustes-protecao/v2-modular/app.py" 
            },
            "comparador.py": { 
              url: "https://raw.githubusercontent.com/lmeurer74/comparador-ajustes-protecao/v2-modular/comparador.py" 
            },
            "leitor_excel.py": { 
              url: "https://raw.githubusercontent.com/lmeurer74/comparador-ajustes-protecao/v2-modular/leitor_excel.py" 
            },
            "leitor_rele.py": { 
              url: "https://raw.githubusercontent.com/lmeurer74/comparador-ajustes-protecao/v2-modular/leitor_rele.py" 
            },
            "mapeamentos.py": { 
              url: "https://raw.githubusercontent.com/lmeurer74/comparador-ajustes-protecao/v2-modular/mapeamentos.py" 
            }
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
