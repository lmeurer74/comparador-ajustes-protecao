<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Comparador de Ajustes</title>
    <!-- Usa sempre a versão mais recente do stlite -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["streamlit", "openpyxl", "pandas"],
          entrypoint: "app.py",
          files: {
            "app.py": { url: "./app.py" },
            "comparador.py": { url: "./comparador.py" },
            "leitor_excel.py": { url: "./leitor_excel.py" },
            "leitor_rele.py": { url: "./leitor_rele.py" },
            "mapeamentos.py": { url: "./mapeamentos.py" }
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
